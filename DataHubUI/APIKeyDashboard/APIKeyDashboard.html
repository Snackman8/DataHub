<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Management Dashboard</title>
    <style>
        /* styles.css */
        body {
            background-color: #fafafa;
        }

        .table {
            font-size: 0.9rem;
        }

        .modal-footer .btn {
            border-color: #6c757d;
        }

        .modal-footer .btn:hover {
            background-color: #6c757d;
            color: white;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">API Key Management Dashboard</h1>

        <button class="btn btn-outline-primary mb-3" id="generate-key-btn" onclick="onOpenModal()">Generate Key Pair</button>

        <table class="table table-striped">
            <thead class="table-light">
                <tr>
                    <th>Key Group</th>
                    <th>Start Date UTC</th>
                    <th>End Date UTC</th>
                    <th>Note</th>
                    <th>Access Key</th>
                    <th>Secret Key</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="key-table-body">
                <!-- Rows will be dynamically generated in JavaScript -->
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="keyModal" tabindex="-1" aria-labelledby="keyModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="keyModalLabel">Generate or Edit Key Pair</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="modal-key-form" onsubmit="onSaveKey(event)">
                    <div class="modal-body" id="keyModalBody">
                        <!-- Dynamic fields will be injected here by JavaScript -->
                    </div>
                    <div class="modal-footer mt-4">
                        <button type="submit" class="btn btn-outline-primary">Save</button>
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="APIKeyDashboard.js"></script>
</body>
</html>
